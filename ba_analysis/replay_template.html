<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BME3201 · BA 离线回放</title>
<style>
:root{color-scheme:light;--ink:#15232b;--muted:#42606c;--line:#d6e0e2;--paper:#fff;--hand:#176a8c;--ball:#b0522e;--cursor:#111b22}
*{box-sizing:border-box}
body{margin:0;background:#eef3f2;color:var(--ink);font:15px/1.55 system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:30px 20px 45px}
header{border-bottom:1px solid #bbced0;padding-bottom:15px;margin-bottom:16px}
h1{font-size:clamp(24px,4vw,38px);line-height:1.15;margin:0 0 8px;letter-spacing:-.025em}
h2{font-size:17px;margin:0 0 6px}
p{margin:5px 0;color:var(--muted)}
section, figure{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
button{font:inherit;font-weight:650;background:#183942;color:#fff;border:0;border-radius:6px;padding:8px 17px;min-width:90px;cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #188e9d;outline-offset:3px}
input[type=range]{flex:1;min-width:110px;accent-color:#176a8c}
output{font:600 15px ui-monospace,monospace;min-width:94px}
#active{min-width:136px;font-weight:650}
#phase-list{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;padding:0;list-style:none;font:13px ui-monospace,monospace}
#phase-list li{padding-left:7px;border-left:4px solid var(--phase)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
canvas{width:100%;display:block}
.spatial{height:256px}
#signals{height:328px;touch-action:pan-y;cursor:crosshair}
.legend{display:flex;gap:18px;color:var(--muted);font-size:13px}
.dot::before{display:inline-block;content:"";width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--dot)}
@media(max-width:660px){.grid{grid-template-columns:1fr}.spatial{height:240px}main{padding:20px 10px}#signals{height:312px}}
</style>
<main>
<header><h1>抓球任务离线回放</h1><p id="meta"></p></header>
<section aria-label="同步回放控制">
  <div class="controls">
    <button id="play" type="button">播放</button>
    <input id="time" type="range" step="0.001" value="0" aria-label="相对 Events.Start 的时间">
    <output id="clock" for="time"></output><span id="active"></span>
  </div>
  <ul id="phase-list" aria-label="运动学初标区间"></ul>
</section>
<div class="grid">
  <figure><h2>手与球 · XY</h2><canvas id="xy" class="spatial" aria-label="手与球在 XY 平面的轨迹"></canvas></figure>
  <figure><h2>手与球 · ZY</h2><canvas id="zy" class="spatial" aria-label="手与球在 ZY 平面的轨迹"></canvas></figure>
</div>
<section>
  <h2>BB / TB / AD / MD 原始肌电</h2>
  <div class="legend"><span class="dot" style="--dot:var(--hand)">手 · 第二掌骨标记</span><span class="dot" style="--dot:var(--ball)">球 · OBJECT</span><span>Y 为高度 · mm</span></div>
  <canvas id="signals" aria-label="四条原始肌电及运动学阶段，同步游标可通过上方滑块或拖拽本图调节"></canvas>
  <p>拖动滑块或肌电图中的游标。空间图圆点随游标移动。肌电采用 mV，各通道单独定标。运动学 125 Hz，肌电 1000 Hz，按标称采样率对齐。</p>
</section>
</main>
<script id="record-data" type="application/json">__REPLAY_DATA__</script>
<script>
"use strict";
const data = JSON.parse(document.querySelector("#record-data").textContent);
const time = document.querySelector("#time"), clock = document.querySelector("#clock");
const active = document.querySelector("#active"), play = document.querySelector("#play");
const phaseColors = {REST:"#dbe6e8", REACH:"#c2e6f0", LIFT_TRANSFER:"#f4dbc5", RETURN:"#d0e7d5"};
const traces = [[data.hand, "#176a8c"], [data.ball,"#b0522e"]];
const first = data.kinT0, last = data.duration;
const axes = ["X", "Y", "Z"];
let now = 0, playing = false, startTime, startValue;
document.querySelector("#meta").textContent = data.id + " · " + data.side + " · " + last.toFixed(3) + " s · 运动学初标";
time.min = first;
time.max = last;
const phases = data.phases.filter(p => p.duration_s !== null);
for (const p of data.phases) {
  const node = document.createElement("li");
  node.style.setProperty("--phase", phaseColors[p.phase]);
  node.textContent = p.phase + (p.duration_s === null ? " · 待定位" : " [" + p.start_s + ", " + p.end_s + ") s");
  document.querySelector("#phase-list").append(node);
}
function plot(id, drawBase) {
  const canvas = document.getElementById(id), backing = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  let w, h;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = backing.width = Math.round(w * dpr);
    canvas.height = backing.height = Math.round(h * dpr);
    const bg = backing.getContext("2d");
    bg.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBase(bg, w, h);
  }
  function overlay(draw) {
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(backing, 0, 0, w, h);
    draw(ctx, w, h);
  }
  return {canvas, resize, overlay};
}
function line(ctx, points, map, color) {
  ctx.beginPath();
  let drawing = false;
  for (let i=0; i < points.length; i++) {
    const xy = map(points[i], i);
    if (!xy) { drawing = false; continue; }
    if (drawing) ctx.lineTo(...xy); else ctx.moveTo(...xy);
    drawing = true;
  }
  ctx.strokeStyle = color;
  ctx.stroke();
}
function spatial(id, horizontal) {
  const coordinates = traces.flatMap(([trace]) => trace).filter(p => p.every(v => v !== null));
  let xMin=Infinity, xMax=-Infinity, yMin=Infinity, yMax=-Infinity;
  for (const p of coordinates) {
    xMin = Math.min(xMin,p[horizontal]); xMax = Math.max(xMax,p[horizontal]);
    yMin = Math.min(yMin,p[1]); yMax = Math.max(yMax,p[1]);
  }
  const map = (p,w,h) => {
    if (!p || p.some(v => v === null)) return null;
    const scale = Math.min((w-92)/Math.max(1,xMax-xMin), (h-76)/Math.max(1,yMax-yMin));
    return [w/2+14+(p[horizontal]-(xMax+xMin)/2)*scale, h/2-4-(p[1]-(yMax+yMin)/2)*scale];
  };
  const pane = plot(id, (ctx,w,h) => {
    ctx.font="12px system-ui";
    ctx.fillStyle="#42606c";
    ctx.fillText("Y", 8, 20);
    ctx.fillText(axes[horizontal], w-18, h-10);
    line(ctx, [[28,12],[28,h-28],[w-8,h-28]], p=>p, "#c2d3d5");
    ctx.lineWidth=1.6;
    for (const [points,color] of traces) line(ctx, points, p=>map(p,w,h), color);
    const bar = Math.abs(map([100,100,100],w,h)[0] - map([0,0,0],w,h)[0]);
    ctx.lineWidth=1;
    line(ctx, [[33,h-12],[33+bar,h-12]], p=>p, "#42606c");
    ctx.fillText("100 mm", 38+bar, h-8);
  });
  pane.draw = () => pane.overlay((ctx,w,h) => {
    const i = Math.min(data.hand.length-1, Math.max(0, Math.floor((now-data.kinT0)*data.kinHz+1e-8)));
    for (const [points,color] of traces) {
      const xy = map(points[i],w,h);
      if (!xy) continue;
      ctx.beginPath();
      ctx.arc(...xy, 5, 0, 2*Math.PI);
      ctx.fillStyle=color; ctx.fill();
      ctx.lineWidth=1.7; ctx.strokeStyle="white"; ctx.stroke();
    }
  });
  return pane;
}
const spatialPlots = [spatial("xy",0),spatial("zy",2)];
const pad = 69, right = 14;
const timelineX = (t,w) => pad+(w-pad-right)*(t-first)/(last-first);
const waves = plot("signals", (ctx,w,h) => {
  const bottom = h-35, row = (bottom-13)/4;
  ctx.font="12px system-ui";
  for (const p of phases) {
    const x1 = timelineX(Number(p.start_s),w), x2 = timelineX(Number(p.end_s),w);
    ctx.fillStyle=phaseColors[p.phase]; ctx.fillRect(x1,13,x2-x1,bottom-13);
    for (const x of [x1,x2]) line(ctx, [[x,13],[x,bottom]], p=>p, "#708b91");
  }
  for (const [i,[name,values]] of Object.entries(data.emg).entries()) {
    const y = 13 + row*(Number(i)+.5);
    let peak = .001;
    for (const v of values) if (v !== null) peak = Math.max(peak,Math.abs(v));
    ctx.fillStyle="#243e47"; ctx.fillText(name,5,y-3);
    ctx.fillStyle="#42606c"; ctx.fillText("±"+peak.toFixed(3),5,y+13);
    line(ctx, [[pad,y],[w-right,y]], p=>p, "#a8b8bd");
    line(ctx, values, (v,j) => v===null ? null :
      [timelineX(data.emgT0+j/data.emgHz,w), y - v/peak*(row*.43)], "#234651");
  }
  for (let t=Math.ceil(first); t<=last; t+=w<525 ? 2 : 1) {
    const x = timelineX(t,w);
    line(ctx, [[x,bottom],[x,bottom+5]], p=>p, "#42606c");
    ctx.fillStyle="#42606c";
    ctx.fillText(t+" s", x-8, bottom+20);
  }
});
function draw() {
  time.value = now;
  clock.value = now.toFixed(3) + " s";
  const phase = phases.find(p => now >= Number(p.start_s) && now < Number(p.end_s));
  active.textContent = phase ? phase.phase : now >= last ? "Events.End" : "阶段间停顿";
  for (const pane of spatialPlots) pane.draw();
  waves.overlay((ctx,w,h) => {
    const x = timelineX(now,w);
    ctx.lineWidth=1.8;
    line(ctx, [[x,9],[x,h-33]], p=>p, "#111b22");
  });
}
function seek(t) { now = Math.round(1000*Math.max(first,Math.min(last,t)))/1000; draw(); }
function pause() { playing = false; play.textContent = "播放"; }
function tick(timestamp) {
  if (!playing) return;
  if (startTime === undefined) startTime = timestamp;
  seek(startValue+(timestamp-startTime)/1000);
  if (now >= last) pause(); else requestAnimationFrame(tick);
}
play.addEventListener("click", () => {
  if (playing) { pause(); return; }
  if (now >= last) seek(first);
  playing = true; play.textContent = "暂停";
  startTime = undefined; startValue = now;
  requestAnimationFrame(tick);
});
time.addEventListener("input", () => { pause(); seek(Number(time.value)); });
function seekPointer(event) {
  const box = waves.canvas.getBoundingClientRect();
  pause();
  seek(first + (event.clientX-box.left-pad)/(box.width-pad-right)*(last-first));
}
waves.canvas.addEventListener("pointerdown", event => {
  waves.canvas.setPointerCapture(event.pointerId);
  seekPointer(event);
});
waves.canvas.addEventListener("pointermove", event => {
  if (waves.canvas.hasPointerCapture(event.pointerId)) seekPointer(event);
});
function layout() {
  for (const pane of [...spatialPlots,waves]) pane.resize();
  draw();
}
window.addEventListener("resize", layout);
layout();
</script>
</html>
